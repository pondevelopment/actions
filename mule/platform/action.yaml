name: "Anypoint Platform"
description: "Handle Design Center, Exchange and API Manager of Anypoint Platform"

inputs:
  REPO_NAME:
    required: true
    description: "The name of the project"
  MERGE_COMMIT:
    required: true
    description: "Merge to development commit message"
  ANYPOINT_CLIENT_ID:
    required: true
    description: "The connected app client id to access anypoint platform"
  ANYPOINT_CLIENT_SECRET:
    required: true
    description: "The connected app client secret to access anypoint platform"
  ANYPOINT_ORG:
    required: true
    description: "The business group id in anypoint platform"
  ENVIRONMENT:
    required: true
    description: "The Mule environment to update"
  ANYPOINT_ENV_ID:
    required: true
    description: "The environment id per business group in anypoint platform"
  PLATFORM_CLIENT_ID:
    required: true
    description: "The client id for PON GLOBAL"
  PLATFORM_CLIENT_SECRET:
    required: true
    description: "The client secret for PON GLOBAL"
  OWNER_ID:
    required: true
    description: "Unique Identifier for user in anypoint platform"
  

runs:
  using: node20
  main: invoke-binary.js